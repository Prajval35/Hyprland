# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12

# Window
confirm_os_window_close 0
background_opacity 0.9
window_padding_width 8

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 1

# Scrolling
scrollback_lines 5000
wheel_scroll_min_lines 1

# Disable bell
enable_audio_bell no

# Performance
repaint_delay 10
input_delay 3

# Wayland
linux_display_server wayland

# Load colors
background #000000
foreground #ff3333

selection_background #ff0000
selection_foreground #000000

cursor #ff0000

color0 #000000
color1 #ff0000
color2 #990000
color3 #cc0000
color4 #660000
color5 #ff3333
color6 #cc3333
color7 #ff6666
